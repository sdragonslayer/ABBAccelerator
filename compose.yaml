services:
  proofrag:
    build: .
    ports:
      - "8000:8000"
    environment:
      PROOFRAG_ENVIRONMENT: production
      PROOFRAG_HOST: 0.0.0.0
      PROOFRAG_DATA_DIR: /app/runtime
      PROOFRAG_DATABASE_PATH: /app/runtime/proofrag.db
      PROOFRAG_ANSWER_PROVIDER: extractive
    volumes:
      - proofrag-data:/app/runtime
    restart: unless-stopped

volumes:
  proofrag-data:
